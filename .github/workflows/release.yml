# Publishes NuGet packages and the oip-common npm package for a published GitHub Release.
# The file name is registered as a trusted publisher for oip-common on npmjs.com,
# renaming it breaks the npm publish step.

name: Release

on:
  release:
    types: [ "published" ]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the version from the release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        # The tag is the only source of the released version, nothing in the tree is compared against it.
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Release tag $TAG is not a SemVer version, expected something like v1.2.3."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        # OIDC requires npm 11.5.1 or later, older npm silently falls back to a token
        run: |
          npm install -g npm@latest
          npm -v
      - name: Restore dependencies
        run: dotnet restore ./src/Oip.sln -p:Version=${{ steps.version.outputs.version }}
      - name: Build
        # The global Version property overrides <Version> from src/Directory.Build.props, the tree keeps its own value.
        run: dotnet build ./src/Oip.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}
      - name: Install web client dependencies
        run: npm ci
        working-directory: ./src/Oip.WebClient
      - name: Set the oip-common version
        # ng-packagr copies this package.json into dist, so the version has to be set before the build.
        run: npm pkg set version=${{ steps.version.outputs.version }}
        working-directory: ./src/Oip.WebClient/projects/oip-common
      - name: Build oip-common
        run: npx ng build oip-common
        working-directory: ./src/Oip.WebClient
      - name: Publish nuget
        run: |
          dotnet nuget push ./src/Oip.Base/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_PUSH_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./src/Oip.Applications.Base/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_PUSH_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./src/Oip.Discussions.Base/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_PUSH_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./src/Oip.Notifications.Base/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_PUSH_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./src/Oip.Users.Base/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_PUSH_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./src/Oip.Cli/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_PUSH_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Publish npm
        run: npm publish
        working-directory: ./src/Oip.WebClient/dist/oip-common
