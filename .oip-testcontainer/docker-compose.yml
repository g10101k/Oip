services:
  oip:
    build:
      context: ../src
      dockerfile: ./Oip/Dockerfile
      args: [ '--force-recreate' ]
      additional_contexts:
        oip-dev-https: ../.oip-devcontainer/https
    ports:
      - "50000:50000"
    volumes:
      - ../.oip-devcontainer/https:/https:ro
    environment:
      TZ: Europe/Moscow
      ConnectionString: XpoProvider=Postgres;Server=postgres;Database=oip;uid=postgres;pwd=postgres;
      SecurityService:BaseUrl: https://localhost:8443/
      SecurityService:DockerUrl: https://keycloak:8443/
      SecurityService:AuthTicketStore:RedisConnectionString: redis:6379
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:50000
      ASPNETCORE_Kestrel__Certificates__Default__Password: P@ssw0rd
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/oip.pfx
    networks:
      - backend-network
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: keycloak
      PGDATA: /data/postgres
    networks:
      - backend-network
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: [ "start-dev", "--import-realm" ]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_METRICS_ENABLED: true
      KEYCLOAK_ADMIN: ${GF_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-P@ssw0rd}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${GF_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-P@ssw0rd}
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/data/cert/oip.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/data/cert/oip.key
    networks:
      - backend-network
      - bridge-network
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9000:9000"
    volumes:
      - ../.oip-devcontainer/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
      - ../.oip-devcontainer/https:/opt/keycloak/data/cert/:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - backend-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus
    volumes:
      - ../.oip-devcontainer/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  selenium-hub:
    image: selenium/hub:4.41.0-20260222
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    environment:
      - TZ=Europe/Moscow
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4444/wd/hub/status" ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  chrome:
    image: selenium/node-chrome:4.41.0-20260222
    platform: linux/amd64
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    volumes:
      # Доверенный dev CA сертификат Oip, чтобы Chrome не ругался на self-signed https://oip:50000
      - ../.oip-devcontainer/https:/usr/local/share/ca-certificates:ro
      # Каталог с тестами доступен внутри контейнера, например для загрузки тестовых файлов
      - ../src/Oip.UiTest:/home/seluser/uploads
    environment:
      - TZ=Europe/Moscow
      - SE_EVENT_BUS_HOST=selenium-hub

  chrome-video:
    image: selenium/video:ffmpeg-8.0-20260222
    volumes:
      - tests_video:/videos
    depends_on:
      - chrome
    environment:
      - TZ=Europe/Moscow
      - DISPLAY_CONTAINER_NAME=chrome
      - SE_NODE_GRID_URL=http://selenium-hub:4444
      - SE_VIDEO_FILE_NAME=auto

  file-browser:
    image: filebrowser/filebrowser:latest
    restart: always
    ports:
      - "8081:80"
    volumes:
      - tests_video:/srv
    environment:
      - TZ=Europe/Moscow
      - FB_NOAUTH=true

networks:
  backend-network: { }
  bridge-network:
    driver: bridge

volumes:
  redis-data:
  tests_video:
