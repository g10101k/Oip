syntax = "proto3";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Oip.Rtds.Grpc";

package events;

service RtdsService {
  rpc Subscribe (SubscribeRequest) returns (stream EventMessage);
  rpc Publish (PublishRequest) returns (PublishResponse);
  rpc GetTags (GetTagsRequest) returns (GetTagsResponse);
  rpc WriteData (WriteDataRequest) returns (WriteDataResponse);
}

message SubscribeRequest {
  string client_id = 1;
  repeated string event_types = 2;
}

message EventMessage {
  string event_id = 1;
  string event_type = 2;
  string payload = 3;
  string timestamp = 4;
}

message PublishRequest {
  string event_type = 1;
  string payload = 2;
}

message PublishResponse {
  bool success = 1;
  string message = 2;
}

message GetTagsRequest {
  uint32 interface_id = 1;
}

// Defines the data types supported for tags. Every member maps onto a ClickHouse column type,
// see Oip.Rtds.Base.TagTypeMap for the mapping. Existing numbers are kept stable because they are
// persisted in the tag metadata database.
enum TagTypes {
  // 32-bit floating point, ClickHouse Float32.
  FLOAT32 = 0;
  // 64-bit floating point, ClickHouse Float64.
  FLOAT64 = 1;
  // 16-bit signed integer, ClickHouse Int16.
  INT16 = 2;
  // 32-bit signed integer, ClickHouse Int32.
  INT32 = 3;
  // Index into a digital state set, stored as ClickHouse UInt8.
  DIGITAL = 4;
  // Text value, ClickHouse String.
  STRING = 5;
  // Binary value, stored as ClickHouse String.
  BLOB = 6;
  // 8-bit signed integer, ClickHouse Int8.
  INT8 = 7;
  // 64-bit signed integer, ClickHouse Int64.
  INT64 = 8;
  // 8-bit unsigned integer, ClickHouse UInt8.
  UINT8 = 9;
  // 16-bit unsigned integer, ClickHouse UInt16.
  UINT16 = 10;
  // 32-bit unsigned integer, ClickHouse UInt32.
  UINT32 = 11;
  // 64-bit unsigned integer, ClickHouse UInt64.
  UINT64 = 12;
  // Boolean value, ClickHouse Bool.
  BOOLEAN = 13;
  // Point in time with millisecond resolution, ClickHouse DateTime64(3, 'UTC').
  DATE_TIME = 14;
}

// Represents the status of a tag value.
enum TagValueStatus {
  // The value is valid and good.
  GOOD = 0;
  // The value is questionable; may be from a backup source or have quality issues.
  QUESTIONABLE = -1;
  // The value was substituted (e.g., manually or by a system process).
  SUBSTITUTED = -2;
  // The value was interpolated between two known data points.
  INTERPOLATED = -3;
  // No data is available for the requested time or range.
  NO_DATA = -4;
  // The data source or interface returned a bad or corrupt value.
  BAD = -5;
  // The PI Server or interface was shut down.
  SHUTDOWN = -6;
  // A calculation failed, e.g., in a formula tag.
  CALC_FAILED = -7;
  // Data was expected but did not arrive in time.
  TIMEOUT = -8;
  // The value is outside of the configured low or high range.
  OUT_OF_RANGE = -9;
}

message TagResponse {
  optional uint32 id = 1;
  string name = 2;
  TagTypes value_type = 3;
  optional uint32 interface_id = 4;
  optional string instrument_tag = 7;
  bool compressing = 9;
  optional uint32 compression_min_time = 10;
  optional uint32 compression_max_time = 11;
  optional string digital_set = 12;
  optional string time_calculation = 14;
  optional string error_calculation = 15;
  optional string value_calculation = 16;
  google.protobuf.Timestamp valueTime = 17;
  // The last known value. The case in use is the one that matches value_type.
  oneof value {
    double double_value = 18;
    int32 int32_value = 19;
    float float_value = 20;
    int64 int64_value = 21;
    uint32 uint32_value = 22;
    uint64 uint64_value = 23;
    bool bool_value = 24;
    string string_value = 25;
    bytes bytes_value = 26;
    google.protobuf.Timestamp timestamp_value = 27;
  };
}

message GetTagsResponse {
  repeated TagResponse tags = 1;
}

message WriteDataTag {
  uint32 id = 1;
  google.protobuf.Timestamp time = 2;
  TagValueStatus status = 3;
  // The value being written. The case in use is the one that matches the value type of the tag.
  oneof value {
    double double_value = 4;
    int32 int32_value = 5;
    float float_value = 6;
    int64 int64_value = 7;
    uint32 uint32_value = 8;
    uint64 uint64_value = 9;
    bool bool_value = 10;
    string string_value = 11;
    bytes bytes_value = 12;
    google.protobuf.Timestamp timestamp_value = 13;
  };
}

message WriteDataRequest {
  repeated WriteDataTag tags = 1;
}

message WriteDataResponse {
  bool success = 1;
  optional string error = 2;
}